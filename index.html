<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Letter Bead Factory</title>
  <link rel="stylesheet" href="style.css">

  <!-- Three.js & Exporters -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
  
  <!-- Indlejret CSG Engine til 100% korrekte 3D-huller -->
  <script src="https://cdn.jsdelivr.net/gh/manthrax/THREE-CSG-Utils@master/ThreeCSG.js"></script>
</head>
<body>

  <header>
    <div class="logo-title">
      <h1>3D Letter Bead Factory 🌸</h1>
    </div>
    <button class="btn btn-primary" id="exportBtn">✨ Export STL Fil</button>
  </header>

  <main>
    <sidebar>
      <div class="control-group">
        <label for="textInput">Bogstav(er) / Tekst</label>
        <input type="text" id="textInput" value="NAVN" maxlength="12">
      </div>

      <div class="control-group">
        <label>Bogstav Højde (Y) <span class="val-badge" id="sizeVal">30 mm</span></label>
        <div class="slider-container">
          <input type="range" id="sizeSlider" min="15" max="60" value="30">
        </div>
      </div>

      <div class="control-group">
        <label>Dybde / Tykkelse (Z) <span class="val-badge" id="depthVal">10 mm</span></label>
        <div class="slider-container">
          <input type="range" id="depthSlider" min="4" max="25" value="10">
        </div>
      </div>

      <div class="control-group">
        <label>Hjørne-afrunding (Bevel) <span class="val-badge" id="bevelVal">1.2 mm</span></label>
        <div class="slider-container">
          <input type="range" id="bevelSlider" min="0" max="3" step="0.2" value="1.2">
        </div>
      </div>

      <div class="control-group">
        <label>Snørehul Diameter <span class="val-badge" id="holeVal">3.5 mm</span></label>
        <div class="slider-container">
          <input type="range" id="holeSlider" min="1" max="8" step="0.5" value="3.5">
        </div>
      </div>

      <div class="control-group">
        <label>Hul Placering (Højde) <span class="val-badge" id="holePosYVal">0 mm</span></label>
        <div class="slider-container">
          <input type="range" id="holePosYSlider" min="-15" max="15" step="0.5" value="0">
        </div>
      </div>

      <div class="control-group">
        <label for="colorSelect">Visningsfarve</label>
        <select id="colorSelect">
          <option value="0xfbcfe8">Pastelrosa</option>
          <option value="0xddd6fe">Pastellilla</option>
          <option value="0xbae6fd">Pastelblå</option>
          <option value="0xfef08a">Pastelgul</option>
          <option value="0xbbf7d0">Pastelgrøn</option>
        </select>
      </div>
    </sidebar>

    <div id="viewport-container">
      <canvas id="canvas3d"></canvas>
      <div class="info-overlay">
        <div>Status: <span id="statusInfo">Klar</span></div>
        <div>Antal Perler: <span id="letterCountInfo">4</span></div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
