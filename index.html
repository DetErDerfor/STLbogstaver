<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letter Bead Factory 3D Generator</title>
  <style>
    :root {
      --bg-dark: #0b0f19;
      --panel-bg: #111827;
      --panel-border: #1f293d;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--panel-border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo-title h1 {
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-title span {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .btn {
      padding: 10px 20px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    main {
      display: flex;
      flex: 1;
      height: calc(100vh - 61px);
    }

    sidebar {
      width: 360px;
      background: var(--panel-bg);
      border-right: 1px solid var(--panel-border);
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(255, 255, 255, 0.02);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .control-group label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 700;
      display: flex;
      justify-content: space-between;
    }

    input[type="text"], select {
      width: 100%;
      padding: 10px;
      background: #0b0f19;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      color: white;
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--accent-blue);
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent-blue);
    }

    .val-badge {
      font-size: 0.8rem;
      color: var(--accent-blue);
      font-weight: bold;
      min-width: 45px;
      text-align: right;
    }

    #viewport-container {
      flex: 1;
      position: relative;
      background: #05070d;
    }

    #canvas3d {
      width: 100%;
      height: 100%;
      display: block;
    }

    .info-overlay {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(8px);
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .info-overlay span {
      color: var(--accent-blue);
      font-weight: bold;
    }
  </style>

  <!-- Three.js Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
</head>
<body>

  <header>
    <div class="logo-title">
      <h1>Letter Bead Factory 3D</h1>
      <span>Parametrisk 3D-Print Generator</span>
    </div>
    <button class="btn btn-primary" id="exportBtn">📥 Export STL Fil</button>
  </header>

  <main>
    <sidebar>
      <div class="control-group">
        <label for="textInput">Tekst / Bogstav</label>
        <input type="text" id="textInput" value="F" maxlength="8">
      </div>

      <div class="control-group">
        <label>Bredde (X) <span class="val-badge" id="widthVal">35 mm</span></label>
        <div class="slider-container">
          <input type="range" id="widthSlider" min="15" max="80" value="35">
        </div>
      </div>

      <div class="control-group">
        <label>Højde (Y) <span class="val-badge" id="heightVal">35 mm</span></label>
        <div class="slider-container">
          <input type="range" id="heightSlider" min="15" max="80" value="35">
        </div>
      </div>

      <div class="control-group">
        <label>Tykkelse / Dybde (Z) <span class="val-badge" id="depthVal">12 mm</span></label>
        <div class="slider-container">
          <input type="range" id="depthSlider" min="4" max="30" value="12">
        </div>
      </div>

      <div class="control-group">
        <label>Hjørne-afrunding <span class="val-badge" id="radiusVal">5 mm</span></label>
        <div class="slider-container">
          <input type="range" id="radiusSlider" min="0" max="15" value="5">
        </div>
      </div>

      <div class="control-group">
        <label>Tekst Størrelse <span class="val-badge" id="textSizeVal">16 mm</span></label>
        <div class="slider-container">
          <input type="range" id="textSizeSlider" min="8" max="40" value="16">
        </div>
      </div>

      <div class="control-group">
        <label>Snørehul Diameter <span class="val-badge" id="holeVal">4.5 mm</span></label>
        <div class="slider-container">
          <input type="range" id="holeSlider" min="0" max="10" step="0.5" value="4.5">
        </div>
      </div>

      <div class="control-group">
        <label for="holeOrient">Snørehul Retning</label>
        <select id="holeOrient">
          <option value="X">X-Akse (Vandret)</option>
          <option value="Y">Y-Akse (Lodret)</option>
        </select>
      </div>

      <div class="control-group">
        <label for="embossMode">Prægningstype</label>
        <select id="embossMode">
          <option value="emboss">Embossed (Forhøjet tekst)</option>
          <option value="engrave">Engraved (Forsænket tekst)</option>
        </select>
      </div>
    </sidebar>

    <div id="viewport-container">
      <canvas id="canvas3d"></canvas>
      <div class="info-overlay">
        <div>Filament-Skift Højde: <span id="swapHeightInfo">12.0 mm</span></div>
        <div>Dimensioner: <span id="dimInfo">35 x 35 x 12 mm</span></div>
      </div>
    </div>
  </main>

  <script>
    const container = document.getElementById('viewport-container');
    const canvas = document.getElementById('canvas3d');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05070d);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, -60, 60);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(40, -40, 80);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const gridHelper = new THREE.GridHelper(200, 40, 0x1f293d, 0x111827);
    gridHelper.rotation.x = Math.PI / 2;
    scene.add(gridHelper);

    let beadMeshGroup = null;
    let loadedFont = null;

    // Load Helvetiker font directly from reliable CDN
    const loader = new THREE.FontLoader();
    loader.load('https://threejs.org/examples/fonts/helvetiker_bold.typeface.json', (font) => {
      loadedFont = font;
      generateBeadGeometry();
    });

    function generateBeadGeometry() {
      if (!loadedFont) return;

      const text = document.getElementById('textInput').value || 'A';
      const width = parseFloat(document.getElementById('widthSlider').value);
      const height = parseFloat(document.getElementById('heightSlider').value);
      const depth = parseFloat(document.getElementById('depthSlider').value);
      const radius = Math.min(parseFloat(document.getElementById('radiusSlider').value), width/2 - 1, height/2 - 1);
      const textSize = parseFloat(document.getElementById('textSizeSlider').value);
      const holeDiam = parseFloat(document.getElementById('holeSlider').value);
      const holeOrient = document.getElementById('holeOrient').value;
      const mode = document.getElementById('embossMode').value;

      // Update UI Labels
      document.getElementById('widthVal').innerText = width + ' mm';
      document.getElementById('heightVal').innerText = height + ' mm';
      document.getElementById('depthVal').innerText = depth + ' mm';
      document.getElementById('radiusVal').innerText = radius + ' mm';
      document.getElementById('textSizeVal').innerText = textSize + ' mm';
      document.getElementById('holeVal').innerText = holeDiam + ' mm';
      document.getElementById('swapHeightInfo').innerText = depth.toFixed(1) + ' mm';
      document.getElementById('dimInfo').innerText = `${width} x ${height} x ${depth} mm`;

      if (beadMeshGroup) scene.remove(beadMeshGroup);

      beadMeshGroup = new THREE.Group();

      // Base Body Shape (Rounded Rectangle)
      const shape = new THREE.Shape();
      const x = -width / 2;
      const y = -height / 2;
      const r = radius;

      shape.moveTo(x + r, y);
      shape.lineTo(x + width - r, y);
      shape.quadraticCurveTo(x + width, y, x + width, y + r);
      shape.lineTo(x + width, y + height - r);
      shape.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
      shape.lineTo(x + r, y + height);
      shape.quadraticCurveTo(x, y + height, x, y + height - r);
      shape.lineTo(x, y + r);
      shape.quadraticCurveTo(x, y, x + r, y);

      const baseGeo = new THREE.ExtrudeGeometry(shape, { depth: depth, bevelEnabled: false });
      const baseMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.3 });
      const baseMesh = new THREE.Mesh(baseGeo, baseMat);
      beadMeshGroup.add(baseMesh);

      // 3D Text Geometry
      const textGeo = new THREE.TextGeometry(text, {
        font: loadedFont,
        size: textSize,
        height: mode === 'emboss' ? 1.5 : 0.4,
        curveSegments: 12,
        bevelEnabled: true,
        bevelThickness: 0.2,
        bevelSize: 0.2,
        bevelSegments: 3
      });

      textGeo.computeBoundingBox();
      const textWidth = textGeo.boundingBox.max.x - textGeo.boundingBox.min.x;
      const textHeight = textGeo.boundingBox.max.y - textGeo.boundingBox.min.y;

      const textMat = new THREE.MeshStandardMaterial({ 
        color: mode === 'emboss' ? 0xffffff : 0x111827, 
        roughness: 0.2 
      });
      const textMesh = new THREE.Mesh(textGeo, textMat);

      // Center text on top of bead
      textMesh.position.x = -textWidth / 2;
      textMesh.position.y = -textHeight / 2;
      textMesh.position.z = mode === 'emboss' ? depth : depth - 0.2;

      beadMeshGroup.add(textMesh);

      // Hole Indicator
      if (holeDiam > 0) {
        const holeGeo = new THREE.CylinderGeometry(holeDiam / 2, holeDiam / 2, (holeOrient === 'X' ? width : height) + 4, 32);
        const holeMat = new THREE.MeshBasicMaterial({ color: 0x05070d });
        const holeMesh = new THREE.Mesh(holeGeo, holeMat);

        if (holeOrient === 'X') {
          holeMesh.rotation.z = Math.PI / 2;
        } else {
          holeMesh.rotation.x = Math.PI / 2;
        }
        holeMesh.position.set(0, 0, depth / 2);
        beadMeshGroup.add(holeMesh);
      }

      scene.add(beadMeshGroup);
    }

    // Event Listeners
    const inputs = ['textInput', 'widthSlider', 'heightSlider', 'depthSlider', 'radiusSlider', 'textSizeSlider', 'holeSlider', 'holeOrient', 'embossMode'];
    inputs.forEach(id => {
      document.getElementById(id).addEventListener('input', generateBeadGeometry);
    });

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // STL Export Functionality
    document.getElementById('exportBtn').addEventListener('click', () => {
      if (!beadMeshGroup) return;

      const exporter = new THREE.STLExporter();
      const result = exporter.parse(beadMeshGroup, { binary: true });
      
      const blob = new Blob([result], { type: 'application/octet-stream' });
      const link = document.createElement('a');
      const filename = (document.getElementById('textInput').value || 'bead') + '_3d.stl';
      
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
