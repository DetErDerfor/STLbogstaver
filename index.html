<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Letter Bead Factory</title>
  <style>
    :root {
      --bg-dark: #0b0f19;
      --panel-bg: #111827;
      --panel-border: #1f293d;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--panel-border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo-title h1 {
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-title span {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .btn {
      padding: 10px 20px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    main {
      display: flex;
      flex: 1;
      height: calc(100vh - 61px);
    }

    sidebar {
      width: 360px;
      background: var(--panel-bg);
      border-right: 1px solid var(--panel-border);
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(255, 255, 255, 0.02);
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .control-group label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 700;
      display: flex;
      justify-content: space-between;
    }

    input[type="text"], select {
      width: 100%;
      padding: 8px 10px;
      background: #0b0f19;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      color: white;
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--accent-blue);
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent-blue);
    }

    .val-badge {
      font-size: 0.8rem;
      color: var(--accent-blue);
      font-weight: bold;
      min-width: 45px;
      text-align: right;
    }

    #viewport-container {
      flex: 1;
      position: relative;
      background: #f3f4f6;
    }

    #canvas3d {
      width: 100%;
      height: 100%;
      display: block;
    }

    .info-overlay {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(8px);
      color: white;
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .info-overlay span {
      color: var(--accent-blue);
      font-weight: bold;
    }
  </style>

  <!-- Three.js Library & Exporters -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
</head>
<body>

  <header>
    <div class="logo-title">
      <h1>3D Letter Bead Factory</h1>
      <span>Parametrisk Bogstavperle Generator</span>
    </div>
    <button class="btn btn-primary" id="exportBtn">📥 Export STL Fil</button>
  </header>

  <main>
    <sidebar>
      <div class="control-group">
        <label for="textInput">Bogstav(er) / Tekst</label>
        <input type="text" id="textInput" value="THEA" maxlength="12">
      </div>

      <div class="control-group">
        <label>Bogstav Højde (Y) <span class="val-badge" id="sizeVal">30 mm</span></label>
        <div class="slider-container">
          <input type="range" id="sizeSlider" min="15" max="60" value="30">
        </div>
      </div>

      <div class="control-group">
        <label>Dybde / Tykkelse (Z) <span class="val-badge" id="depthVal">10 mm</span></label>
        <div class="slider-container">
          <input type="range" id="depthSlider" min="4" max="25" value="10">
        </div>
      </div>

      <div class="control-group">
        <label>Hjørne-afrunding (Bevel) <span class="val-badge" id="bevelVal">1.2 mm</span></label>
        <div class="slider-container">
          <input type="range" id="bevelSlider" min="0" max="3" step="0.2" value="1.2">
        </div>
      </div>

      <div class="control-group">
        <label>Snørehul Diameter <span class="val-badge" id="holeVal">3.5 mm</span></label>
        <div class="slider-container">
          <input type="range" id="holeSlider" min="1" max="8" step="0.5" value="3.5">
        </div>
      </div>

      <div class="control-group">
        <label>Hul Placering (Højde) <span class="val-badge" id="holePosYVal">0 mm</span></label>
        <div class="slider-container">
          <input type="range" id="holePosYSlider" min="-15" max="15" step="0.5" value="0">
        </div>
      </div>

      <div class="control-group">
        <label for="colorSelect">Visningsfarve</label>
        <select id="colorSelect">
          <option value="0x8b5cf6">Lilla</option>
          <option value="0x3b82f6">Blå</option>
          <option value="0x10b981">Grøn</option>
          <option value="0xef4444">Rød</option>
        </select>
      </div>
    </sidebar>

    <div id="viewport-container">
      <canvas id="canvas3d"></canvas>
      <div class="info-overlay">
        <div>Antal Perler: <span id="letterCountInfo">4</span></div>
        <div>Højde: <span id="heightInfo">30 mm</span></div>
      </div>
    </div>
  </main>

  <script>
    // --- THREE.JS CSG (Constructive Solid Geometry) BSP ENGINE ---
    const CSG = (function() {
      class Node {
        constructor(polygons) {
          this.plane = null;
          this.front = null;
          this.back = null;
          this.polygons = [];
          if (polygons) this.build(polygons);
        }
        clone() {
          const node = new Node();
          node.plane = this.plane && this.plane.clone();
          node.front = this.front && this.front.clone();
          node.back = this.back && this.back.clone();
          node.polygons = this.polygons.map(p => p.clone());
          return node;
        }
        invert() {
          for (let i = 0; i < this.polygons.length; i++) this.polygons[i].flip();
          if (this.plane) this.plane.flip();
          if (this.front) this.front.invert();
          if (this.back) this.back.invert();
          const temp = this.front;
          this.front = this.back;
          this.back = temp;
        }
        clipPolygons(polygons) {
          if (!this.plane) return polygons.slice();
          let front = [], back = [];
          for (let i = 0; i < polygons.length; i++) {
            this.plane.splitPolygon(polygons[i], front, back, front, back);
          }
          if (this.front) front = this.front.clipPolygons(front);
          if (this.back) back = this.back.clipPolygons(back);
          else back = [];
          return front.concat(back);
        }
        filterPolygons(polygons) {
          return this.clipPolygons(polygons);
        }
        clipTo(num) {
          this.polygons = num.clipPolygons(this.polygons);
          if (this.front) this.front.clipTo(num);
          if (this.back) this.back.clipTo(num);
        }
        allPolygons() {
          let polygons = this.polygons.slice();
          if (this.front) polygons = polygons.concat(this.front.allPolygons());
          if (this.back) polygons = polygons.concat(this.back.allPolygons());
          return polygons;
        }
        build(polygons) {
          if (!polygons.length) return;
          if (!this.plane) this.plane = polygons[0].plane.clone();
          const front = [], back = [];
          for (let i = 0; i < polygons.length; i++) {
            this.plane.splitPolygon(polygons[i], this.polygons, this.polygons, front, back);
          }
          if (front.length) {
            if (!this.front) this.front = new Node();
            this.front.build(front);
          }
          if (back.length) {
            if (!this.back) this.back = new Node();
            this.back.build(back);
          }
        }
      }

      class Vector {
        constructor(x, y, z) {
          this.x = x || 0; this.y = y || 0; this.z = z || 0;
        }
        clone() { return new Vector(this.x, this.y, this.z); }
        negate() { return new Vector(-this.x, -this.y, -this.z); }
        add(a) { return new Vector(this.x + a.x, this.y + a.y, this.z + a.z); }
        sub(a) { return new Vector(this.x - a.x, this.y - a.y, this.z - a.z); }
        multiplyScalar(a) { return new Vector(this.x * a, this.y * a, this.z * a); }
        dot(a) { return this.x * a.x + this.y * a.y + this.z * a.z; }
        lerp(a, t) { return this.add(a.sub(this).multiplyScalar(t)); }
        cross(a) { return new Vector(this.y * a.z - this.z * a.y, this.z * a.x - this.x * a.z, this.x * a.y - this.y * a.x); }
        normalize() { const l = Math.sqrt(this.dot(this)); return l > 0 ? this.multiplyScalar(1 / l) : new Vector(); }
      }

      class Vertex {
        constructor(pos, normal) {
          this.pos = pos;
          this.normal = normal || new Vector();
        }
        clone() { return new Vertex(this.pos.clone(), this.normal.clone()); }
        flip() { this.normal = this.normal.negate(); }
        interpolate(other, t) {
          return new Vertex(this.pos.lerp(other.pos, t), this.normal.lerp(other.normal, t));
        }
      }

      class Plane {
        constructor(normal, w) {
          this.normal = normal;
          this.w = w;
        }
        clone() { return new Plane(this.normal.clone(), this.w); }
        flip() { this.normal = this.normal.negate(); this.w = -this.w; }
        splitPolygon(polygon, coplanarFront, coplanarBack, front, back) {
          const COPLANAR = 0, FRONT = 1, BACK = 2, SPANNING = 3;
          let polygonType = 0;
          const types = [];
          for (let i = 0; i < polygon.vertices.length; i++) {
            const t = this.normal.dot(polygon.vertices[i].pos) - this.w;
            const type = (t < -1e-5) ? BACK : (t > 1e-5) ? FRONT : COPLANAR;
            polygonType |= type;
            types.push(type);
          }
          switch (polygonType) {
            case COPLANAR:
              (this.normal.dot(polygon.plane.normal) > 0 ? coplanarFront : coplanarBack).push(polygon);
              break;
            case FRONT: front.push(polygon); break;
            case BACK: back.push(polygon); break;
            case SPANNING:
              const f = [], b = [];
              for (let i = 0; i < polygon.vertices.length; i++) {
                const j = (i + 1) % polygon.vertices.length;
                const ti = types[i], tj = types[j];
                const vi = polygon.vertices[i], vj = polygon.vertices[j];
                if (ti !== BACK) f.push(vi);
                if (ti !== FRONT) b.push(vi);
                if ((ti | tj) === SPANNING) {
                  const t = (this.w - this.normal.dot(vi.pos)) / this.normal.dot(vj.pos.sub(vi.pos));
                  const v = vi.interpolate(vj, t);
                  f.push(v);
                  b.push(v);
                }
              }
              if (f.length >= 3) front.push(new Polygon(f));
              if (b.length >= 3) back.push(new Polygon(b));
              break;
          }
        }
      }

      Plane.fromPoints = function(a, b, c) {
        const n = b.sub(a).cross(c.sub(a)).normalize();
        return new Plane(n, n.dot(a));
      };

      class Polygon {
        constructor(vertices) {
          this.vertices = vertices;
          this.plane = Plane.fromPoints(vertices[0].pos, vertices[1].pos, vertices[2].pos);
        }
        clone() { return new Polygon(this.vertices.map(v => v.clone())); }
        flip() {
          this.vertices.reverse().forEach(v => v.flip());
          this.plane.flip();
        }
      }

      class CSGObject {
        constructor() { this.polygons = []; }
        clone() {
          const csg = new CSGObject();
          csg.polygons = this.polygons.map(p => p.clone());
          return csg;
        }
        toPolygons() { return this.polygons; }
        subtract(other) {
          const a = new Node(this.clone().polygons);
          const b = new Node(other.clone().polygons);
          a.invert();
          a.clipTo(b);
          b.clipTo(a);
          b.invert();
          b.clipTo(a);
          b.invert();
          a.build(b.allPolygons());
          a.invert();
          const csg = new CSGObject();
          csg.polygons = a.allPolygons();
          return csg;
        }
      }

      function fromGeometry(geom) {
        const csg = new CSGObject();
        let g = geom.isBufferGeometry ? geom : new THREE.BufferGeometry().fromGeometry(geom);
        const pos = g.attributes.position;
        const norm = g.attributes.normal;
        const index = g.index;
        const polys = [];

        if (index) {
          for (let i = 0; i < index.count; i += 3) {
            const verts = [];
            for (let j = 0; j < 3; j++) {
              const idx = index.getX(i + j);
              const p = new Vector(pos.getX(idx), pos.getY(idx), pos.getZ(idx));
              const n = norm ? new Vector(norm.getX(idx), norm.getY(idx), norm.getZ(idx)) : new Vector();
              verts.push(new Vertex(p, n));
            }
            polys.push(new Polygon(verts));
          }
        } else {
          for (let i = 0; i < pos.count; i += 3) {
            const verts = [];
            for (let j = 0; j < 3; j++) {
              const p = new Vector(pos.getX(i + j), pos.getY(i + j), pos.getZ(i + j));
              const n = norm ? new Vector(norm.getX(i + j), norm.getY(i + j), norm.getZ(i + j)) : new Vector();
              verts.push(new Vertex(p, n));
            }
            polys.push(new Polygon(verts));
          }
        }
        csg.polygons = polys;
        return csg;
      }

      function toGeometry(csg) {
        const geom = new THREE.BufferGeometry();
        const positions = [];
        const normals = [];

        csg.polygons.forEach(p => {
          for (let i = 2; i < p.vertices.length; i++) {
            const v0 = p.vertices[0], v1 = p.vertices[i - 1], v2 = p.vertices[i];
            positions.push(v0.pos.x, v0.pos.y, v0.pos.z);
            positions.push(v1.pos.x, v1.pos.y, v1.pos.z);
            positions.push(v2.pos.x, v2.pos.y, v2.pos.z);

            normals.push(v0.normal.x, v0.normal.y, v0.normal.z);
            normals.push(v1.normal.x, v1.normal.y, v1.normal.z);
            normals.push(v2.normal.x, v2.normal.y, v2.normal.z);
          }
        });

        geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geom.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
        return geom;
      }

      return {
        subtract: function(meshA, meshB) {
          meshA.updateMatrixWorld();
          meshB.updateMatrixWorld();

          const geoA = meshA.geometry.clone();
          geoA.applyMatrix4(meshA.matrixWorld);

          const geoB = meshB.geometry.clone();
          geoB.applyMatrix4(meshB.matrixWorld);

          const csgA = fromGeometry(geoA);
          const csgB = fromGeometry(geoB);
          const resultCSG = csgA.subtract(csgB);

          const resultGeo = toGeometry(resultCSG);
          const resMesh = new THREE.Mesh(resultGeo, meshA.material);
          return resMesh;
        }
      };
    })();

    // --- APPLICATION LOGIC ---
    const container = document.getElementById('viewport-container');
    const canvas = document.getElementById('canvas3d');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf3f4f6);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, -50, 80);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.65);
    dirLight.position.set(30, -30, 60);
    scene.add(dirLight);

    let beadGroup = null;
    let loadedFont = null;

    const loader = new THREE.FontLoader();
    loader.load('https://threejs.org/examples/fonts/helvetiker_bold.typeface.json', (font) => {
      loadedFont = font;
      generateLetterBeads();
    });

    function generateLetterBeads() {
      if (!loadedFont) return;

      const rawText = document.getElementById('textInput').value.trim() || 'T';
      const letters = rawText.toUpperCase().split('');
      const size = parseFloat(document.getElementById('sizeSlider').value);
      const depth = parseFloat(document.getElementById('depthSlider').value);
      const bevel = parseFloat(document.getElementById('bevelSlider').value);
      const holeDiam = parseFloat(document.getElementById('holeSlider').value);
      const holePosY = parseFloat(document.getElementById('holePosYSlider').value);
      const colorHex = parseInt(document.getElementById('colorSelect').value);

      document.getElementById('sizeVal').innerText = size + ' mm';
      document.getElementById('depthVal').innerText = depth + ' mm';
      document.getElementById('bevelVal').innerText = bevel + ' mm';
      document.getElementById('holeVal').innerText = holeDiam + ' mm';
      document.getElementById('holePosYVal').innerText = holePosY + ' mm';
      document.getElementById('letterCountInfo').innerText = letters.length;
      document.getElementById('heightInfo').innerText = size + ' mm';

      if (beadGroup) scene.remove(beadGroup);
      beadGroup = new THREE.Group();

      const mat = new THREE.MeshStandardMaterial({
        color: colorHex,
        roughness: 0.3,
        metalness: 0.1
      });

      let currentX = 0;
      const spacing = size * 1.25;

      letters.forEach((char) => {
        // 1. Opret Grundgeometri for Bogstavet
        const textGeo = new THREE.TextGeometry(char, {
          font: loadedFont,
          size: size,
          height: depth,
          curveSegments: 8,
          bevelEnabled: bevel > 0,
          bevelThickness: bevel,
          bevelSize: bevel * 0.8,
          bevelSegments: 3
        });

        textGeo.computeBoundingBox();
        const bbox = textGeo.boundingBox;
        const charWidth = bbox.max.x - bbox.min.x;
        const charHeight = bbox.max.y - bbox.min.y;

        textGeo.translate(-charWidth / 2 - bbox.min.x, -charHeight / 2 - bbox.min.y, -depth / 2);
        const letterMesh = new THREE.Mesh(textGeo, mat);

        let finalMesh = letterMesh;

        // 2. Skær hullet ud med ægte indlejret CSG udskæring
        if (holeDiam > 0) {
          const holeLength = charWidth + 20;
          const holeGeo = new THREE.CylinderGeometry(holeDiam / 2, holeDiam / 2, holeLength, 24);
          holeGeo.rotateZ(Math.PI / 2);

          const holeMesh = new THREE.Mesh(holeGeo, mat);
          holeMesh.position.set(0, holePosY, 0);

          try {
            finalMesh = CSG.subtract(letterMesh, holeMesh);
          } catch (e) {
            console.warn('CSG udskæring fejlede:', e);
          }
        }

        finalMesh.position.x = currentX;
        currentX += spacing;

        beadGroup.add(finalMesh);
      });

      const totalWidth = (letters.length - 1) * spacing;
      beadGroup.position.x = -totalWidth / 2;

      scene.add(beadGroup);
    }

    // Event Listeners
    const inputs = ['textInput', 'sizeSlider', 'depthSlider', 'bevelSlider', 'holeSlider', 'holePosYSlider', 'colorSelect'];
    inputs.forEach(id => {
      document.getElementById(id).addEventListener('input', generateLetterBeads);
    });

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // STL Export
    document.getElementById('exportBtn').addEventListener('click', () => {
      if (!beadGroup) return;

      const exporter = new THREE.STLExporter();
      const result = exporter.parse(beadGroup, { binary: true });

      const blob = new Blob([result], { type: 'application/octet-stream' });
      const link = document.createElement('a');
      const filename = (document.getElementById('textInput').value.trim() || 'beads') + '_3d.stl';

      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
