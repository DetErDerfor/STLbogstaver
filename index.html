<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letter Bead Factory 3D - Direct Letter Beads</title>
  <style>
    :root {
      --bg-dark: #0b0f19;
      --panel-bg: #111827;
      --panel-border: #1f293d;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--panel-border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo-title h1 {
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-title span {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .btn {
      padding: 10px 20px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    main {
      display: flex;
      flex: 1;
      height: calc(100vh - 61px);
    }

    sidebar {
      width: 360px;
      background: var(--panel-bg);
      border-right: 1px solid var(--panel-border);
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(255, 255, 255, 0.02);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .control-group label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 700;
      display: flex;
      justify-content: space-between;
    }

    input[type="text"], select {
      width: 100%;
      padding: 10px;
      background: #0b0f19;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      color: white;
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--accent-blue);
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent-blue);
    }

    .val-badge {
      font-size: 0.8rem;
      color: var(--accent-blue);
      font-weight: bold;
      min-width: 45px;
      text-align: right;
    }

    #viewport-container {
      flex: 1;
      position: relative;
      background: #05070d;
    }

    #canvas3d {
      width: 100%;
      height: 100%;
      display: block;
    }

    .info-overlay {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(8px);
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .info-overlay span {
      color: var(--accent-blue);
      font-weight: bold;
    }
  </style>

  <!-- Three.js & Exporters -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
</head>
<body>

  <header>
    <div class="logo-title">
      <h1>3D Letter Bead Factory</h1>
      <span>3D-Printbare Bogstavperler</span>
    </div>
    <button class="btn btn-primary" id="exportBtn">📥 Export STL Fil</button>
  </header>

  <main>
    <sidebar>
      <div class="control-group">
        <label for="textInput">Bogstav / Tekst</label>
        <input type="text" id="textInput" value="T" maxlength="10">
      </div>

      <div class="control-group">
        <label>Bogstav Højde <span class="val-badge" id="sizeVal">30 mm</span></label>
        <div class="slider-container">
          <input type="range" id="sizeSlider" min="15" max="60" value="30">
        </div>
      </div>

      <div class="control-group">
        <label>Dybde / Tykkelse (Z) <span class="val-badge" id="depthVal">10 mm</span></label>
        <div class="slider-container">
          <input type="range" id="depthSlider" min="4" max="25" value="10">
        </div>
      </div>

      <div class="control-group">
        <label>Snørehul Diameter <span class="val-badge" id="holeVal">3.5 mm</span></label>
        <div class="slider-container">
          <input type="range" id="holeSlider" min="1" max="8" step="0.5" value="3.5">
        </div>
      </div>

      <div class="control-group">
        <label for="holeOrient">Snørehul Retning</label>
        <select id="holeOrient">
          <option value="X">X-Akse (Vandret igennem)</option>
          <option value="Y">Y-Akse (Lodret igennem)</option>
        </select>
      </div>

      <div class="control-group">
        <label for="colorSelect">Visningsfarve</label>
        <select id="colorSelect">
          <option value="0x8b5cf6">Lilla (Standard)</option>
          <option value="0x3b82f6">Blå</option>
          <option value="0x10b981">Grøn</option>
          <option value="0xef4444">Rød</option>
          <option value="0xf59e0b">Orange</option>
        </select>
      </div>
    </sidebar>

    <div id="viewport-container">
      <canvas id="canvas3d"></canvas>
      <div class="info-overlay">
        <div>Antal Bogstaver: <span id="letterCountInfo">1</span></div>
        <div>Perle Højde: <span id="heightInfo">30 mm</span></div>
      </div>
    </div>
  </main>

  <script>
    const container = document.getElementById('viewport-container');
    const canvas = document.getElementById('canvas3d');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf3f4f6); // Lys baggrund som på eksemplet

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, -50, 70);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Lyssætning tilpasset blød 3D-visning
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(30, -30, 60);
    scene.add(dirLight);

    let beadGroup = null;
    let loadedFont = null;

    // Henter afrundet 3D font
    const loader = new THREE.FontLoader();
    loader.load('https://threejs.org/examples/fonts/helvetiker_bold.typeface.json', (font) => {
      loadedFont = font;
      generateLetterBeads();
    });

    function generateLetterBeads() {
      if (!loadedFont) return;

      const rawText = document.getElementById('textInput').value.trim() || 'T';
      const letters = rawText.toUpperCase().split('');
      const size = parseFloat(document.getElementById('sizeSlider').value);
      const depth = parseFloat(document.getElementById('depthSlider').value);
      const holeDiam = parseFloat(document.getElementById('holeSlider').value);
      const holeOrient = document.getElementById('holeOrient').value;
      const colorHex = parseInt(document.getElementById('colorSelect').value);

      // Opdater UI labels
      document.getElementById('sizeVal').innerText = size + ' mm';
      document.getElementById('depthVal').innerText = depth + ' mm';
      document.getElementById('holeVal').innerText = holeDiam + ' mm';
      document.getElementById('letterCountInfo').innerText = letters.length;
      document.getElementById('heightInfo').innerText = size + ' mm';

      if (beadGroup) scene.remove(beadGroup);
      beadGroup = new THREE.Group();

      const mat = new THREE.MeshStandardMaterial({
        color: colorHex,
        roughness: 0.3,
        metalness: 0.1
      });

      let currentX = 0;
      const spacing = size * 1.1;

      letters.forEach((char, index) => {
        const charGroup = new THREE.Group();

        // Generer bogstav-geometri
        const textGeo = new THREE.TextGeometry(char, {
          font: loadedFont,
          size: size,
          height: depth,
          curveSegments: 16,
          bevelEnabled: true,
          bevelThickness: 1.2,
          bevelSize: 1.0,
          bevelOffset: 0,
          bevelSegments: 5
        });

        textGeo.computeBoundingBox();
        const bbox = textGeo.boundingBox;
        const charWidth = bbox.max.x - bbox.min.x;
        const charHeight = bbox.max.y - bbox.min.y;

        const textMesh = new THREE.Mesh(textGeo, mat);
        // Centrer bogstavet
        textMesh.position.set(-charWidth / 2, -charHeight / 2, 0);
        charGroup.add(textMesh);

        // Opret snørehul gennem bogstavet
        if (holeDiam > 0) {
          const holeLen = Math.max(charWidth, charHeight, size) + 10;
          const holeGeo = new THREE.CylinderGeometry(holeDiam / 2, holeDiam / 2, holeLen, 32);
          const holeMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
          const holeMesh = new THREE.Mesh(holeGeo, holeMat);

          if (holeOrient === 'X') {
            holeMesh.rotation.z = Math.PI / 2;
          } else {
            holeMesh.rotation.x = Math.PI / 2;
          }
          holeMesh.position.set(0, 0, depth / 2);
          charGroup.add(holeMesh);
        }

        // Placér bogstaver ved siden af hinanden hvis flere
        charGroup.position.x = currentX;
        currentX += spacing;

        beadGroup.add(charGroup);
      });

      // Centrer hele gruppen i viewport
      const totalWidth = (letters.length - 1) * spacing;
      beadGroup.position.x = -totalWidth / 2;

      scene.add(beadGroup);
    }

    // Event Listeners
    const inputs = ['textInput', 'sizeSlider', 'depthSlider', 'holeSlider', 'holeOrient', 'colorSelect'];
    inputs.forEach(id => {
      document.getElementById(id).addEventListener('input', generateLetterBeads);
    });

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // STL Export
    document.getElementById('exportBtn').addEventListener('click', () => {
      if (!beadGroup) return;

      const exporter = new THREE.STLExporter();
      const result = exporter.parse(beadGroup, { binary: true });

      const blob = new Blob([result], { type: 'application/octet-stream' });
      const link = document.createElement('a');
      const filename = (document.getElementById('textInput').value.trim() || 'letter_bead') + '_3d.stl';

      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
